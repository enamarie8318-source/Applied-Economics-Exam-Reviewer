<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Applied Economics — Gamified Review</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 5px 20px #00000012}
h1{margin:0 0 5px;font-size:28px} h2{font-size:22px;line-height:1.4}
.small{color:#667085;font-size:14px} .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar{height:10px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-top:15px}
.fill{height:100%;width:0;background:#4f46e5;transition:.3s}
.option{width:100%;padding:15px;margin:7px 0;border:2px solid #e3e8f0;background:#fff;border-radius:13px;text-align:left;font-size:16px;cursor:pointer}
.option:hover{border-color:#4f46e5;background:#f8f8ff}
.option.correct{border-color:#16a34a;background:#f0fdf4} .option.wrong{border-color:#dc2626;background:#fef2f2}
button.next,.restart{width:100%;padding:14px;border:0;border-radius:12px;background:#4f46e5;color:white;font-weight:bold;font-size:16px;cursor:pointer;margin-top:12px}
button:disabled{opacity:.45;cursor:not-allowed}
.feedback{margin-top:14px;padding:14px;border-radius:12px;background:#f6f8fc;line-height:1.5}
.badge{display:inline-block;padding:5px 10px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:13px;font-weight:bold}
.score{font-weight:bold} .hidden{display:none} .start{text-align:center}
@media(max-width:520px){.wrap{padding:10px}.card{padding:17px}h1{font-size:24px}h2{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<div id="start" class="card start">
<h1>🎮 Applied Economics Challenge</h1>
<p>ALS Grade 11 • LAS 1–13</p>
<p class="small">A randomized 60-item review game. Easy = 1 point • Moderate = 2 points • Hard = 3 points.</p>
<button class="next" id="begin">🚀 Start Review</button>
</div>

<div id="game" class="hidden">
<div class="card">
<div class="top">
<div><b>Applied Economics</b><div class="small" id="count">Question 1 of 60</div></div>
<div class="score">⭐ <span id="score">0</span> pts<br><span class="small">🔥 Streak: <span id="streak">0</span></span></div>
</div>
<div class="bar"><div class="fill" id="fill"></div></div>
</div>

<div class="card">
<span class="badge" id="difficulty">Difficulty</span>
<h2 id="question"></h2>
<div id="options"></div>
<div id="feedback"></div>
<button class="next" id="next" disabled>Next Question →</button>
</div>
</div>

<div id="finish" class="card start hidden">
<h1>🏆 Review Complete!</h1>
<h2 id="final"></h2>
<p id="message"></p>
<button class="restart" id="again">🔄 Play Again — Randomize Again</button>
</div>
</div>

<script>
const DATA=[{"q": "Which statement best describes economics according to the LAS?", "o": ["The study of how to use scarce resources to address needs and balance demand and supply", "The study of weather patterns only", "The study of government elections only", "The study of historical events only"], "a": 0, "d": "Easy", "e": "Economics deals with scarcity and the use of resources to meet needs."}, {"q": "Which branch of economics deals with managing a family budget?", "o": ["National economics", "Household economics", "International economics", "Business economics"], "a": 1, "d": "Easy", "e": "Household economics focuses on ways of running a family budget."}, {"q": "A Filipino business owner studies jobs, workers’ salaries, production, capital use, and profit. Which area is most directly involved?", "o": ["Household economics", "Business economics", "International economics", "Political science"], "a": 1, "d": "Moderate", "e": "Business economics considers capital use, job creation, salaries, production, and profit."}, {"q": "A student examines how OFW remittances and exchange rates affect Filipino families. Which field is most relevant?", "o": ["International economics", "Household economics only", "Business economics only", "History only"], "a": 0, "d": "Moderate", "e": "International economics includes overseas workers, exchange rates, trade, and related international activities."}, {"q": "Why is applied economics useful in real-life settings?", "o": ["It replaces all other social sciences.", "It applies economic concepts to practical issues in fields such as labor, business, agriculture, education, and health.", "It focuses only on memorizing economic terms.", "It studies only the national income."], "a": 1, "d": "Hard", "e": "Applied economics uses economic concepts to address practical issues in specific settings."}, {"q": "Why is economics regarded as a social science?", "o": ["It studies only natural phenomena.", "It uses scientific methods to explain behavior of individuals, groups, and organizations.", "It avoids theories.", "It studies machines only."], "a": 1, "d": "Easy", "e": "The LAS describes economics as a social science because it uses scientific methods to explain human and organizational behavior."}, {"q": "Which economic problem asks what goods or services should be produced?", "o": ["How to produce", "For whom to produce", "What to produce and how much", "Where to export"], "a": 2, "d": "Easy", "e": "The first basic economic problem concerns what to produce and how much."}, {"q": "A government must decide whether to use available resources for more public transportation or more health services. Which basic problem is illustrated?", "o": ["What to produce and how much", "For whom to produce only", "How to export", "How to advertise"], "a": 0, "d": "Moderate", "e": "The government is deciding which goods/services to produce and in what amount."}, {"q": "Which social science is related to economics because government and laws interact with economic forces?", "o": ["History", "Political Science", "Sociology", "Geography"], "a": 1, "d": "Moderate", "e": "The LAS links economics with Political Science through government and laws."}, {"q": "A country has limited resources and must determine the production method that uses those resources most appropriately. Which question is being addressed?", "o": ["What to produce", "How to produce", "For whom to produce", "Who should vote"], "a": 1, "d": "Hard", "e": "“How to produce” concerns the production method used to make goods and services."}, {"q": "Which of the following is identified in the LAS as a recurring economic problem in Philippine society?", "o": ["Hunger", "Too much leisure", "Excess supply of all goods", "Unlimited resources"], "a": 0, "d": "Easy", "e": "Hunger is one of the recurring economic problems listed in the LAS."}, {"q": "What does scarcity mean?", "o": ["People have unlimited resources.", "People may not have enough resources for themselves.", "All needs are automatically satisfied.", "Prices never change."], "a": 1, "d": "Easy", "e": "The LAS explains scarcity as a condition in which people may not have enough resources."}, {"q": "Which set contains the economic resources specifically mentioned in LAS 3?", "o": ["Land, labor, capital", "Money, weather, elections", "Technology, religion, culture", "Imports, exports, taxes"], "a": 0, "d": "Moderate", "e": "The LAS identifies land, labor, and capital when discussing inequality in resource use."}, {"q": "How can understanding scarcity help economics students?", "o": ["By encouraging them to ignore limited resources", "By helping them analyze how to maximize the use of available resources", "By eliminating all prices", "By preventing production"], "a": 1, "d": "Moderate", "e": "Understanding scarcity helps students analyze how available resources can be used more effectively."}, {"q": "A student observes that a shortage of a product causes its price to rise. Which economic concepts from the LAS can best help analyze the situation?", "o": ["Scarcity and demand-supply principles", "Political campaigns only", "History only", "Social class only"], "a": 0, "d": "Hard", "e": "The LAS connects scarcity and demand-supply principles with understanding high prices and possible solutions."}, {"q": "According to the law of demand, when the price of a good increases, what generally happens to quantity demanded?", "o": ["It increases", "It decreases", "It becomes unlimited", "It stays exactly the same"], "a": 1, "d": "Easy", "e": "A higher price is associated with a lower quantity demanded."}, {"q": "What does the symbol P1 or P2 represent in the LAS demand-and-supply figures?", "o": ["Price", "Product", "Producer", "Population"], "a": 0, "d": "Easy", "e": "P1 and P2 represent different price levels."}, {"q": "What does S represent in a standard supply-and-demand graph?", "o": ["Scarcity", "Supply", "Sales tax", "Social class"], "a": 1, "d": "Moderate", "e": "S represents the supply curve."}, {"q": "If the price of a product falls, what does the law of demand suggest about quantity demanded, all else equal?", "o": ["It tends to increase.", "It tends to decrease.", "It becomes zero.", "It cannot change."], "a": 0, "d": "Moderate", "e": "Lower prices generally lead to greater demand."}, {"q": "In the LAS graph, equilibrium is associated with the interaction of supply and demand. Which statement best describes this point?", "o": ["It is where buyers and sellers have no interaction.", "It is where the supply and demand relationships meet to determine an equilibrium price and quantity.", "It is always the highest possible price.", "It is always the lowest possible quantity."], "a": 1, "d": "Hard", "e": "Equilibrium results from the interaction of supply and demand and determines an equilibrium price and quantity."}, {"q": "Which factor refers to what consumers want to buy?", "o": ["Tastes and preferences", "Technology", "Expectations", "Occupation"], "a": 0, "d": "Easy", "e": "Tastes and preferences describe what consumers want to buy."}, {"q": "Which factor can improve a producer’s ability to supply a good?", "o": ["Technology", "Race", "Family size", "History"], "a": 0, "d": "Easy", "e": "Technological improvements can increase a producer’s ability to supply goods."}, {"q": "If consumers expect the price of a product to decrease soon, what may happen to demand in the short term?", "o": ["Demand may decrease because consumers wait.", "Demand must immediately double.", "Supply becomes zero.", "Income automatically increases."], "a": 0, "d": "Moderate", "e": "Consumers may wait for lower prices, decreasing short-term demand."}, {"q": "Which factor includes the prices of substitutes and complementary goods?", "o": ["Income", "Price and availability of related goods", "Technology", "Expectations"], "a": 1, "d": "Moderate", "e": "The LAS identifies related goods as substitutes and complementary goods."}, {"q": "A furniture producer adopts better technology that makes production easier. Based on the LAS, what is the most likely effect?", "o": ["Supply increases and price may fall.", "Supply decreases and price must rise.", "Demand automatically becomes zero.", "Income of all consumers falls."], "a": 0, "d": "Hard", "e": "Improved technology increases supply and may cause prices to fall."}, {"q": "What does SRP stand for in the LAS?", "o": ["Suggested Retail Price", "Standard Resource Plan", "Supply Rate Program", "Social Retail Policy"], "a": 0, "d": "Easy", "e": "SRP means Suggested Retail Price."}, {"q": "Which agency is mentioned as monitoring prices of basic necessities and prime commodities?", "o": ["DTI", "DOH", "DepEd", "DFA"], "a": 0, "d": "Easy", "e": "The Department of Trade and Industry (DTI) is identified in LAS 6."}, {"q": "Why is comparing actual market prices with the DTI SRP useful to consumers?", "o": ["It can guide them on what or where to buy at the right price.", "It guarantees that every store has identical prices.", "It eliminates all demand.", "It prevents consumers from shopping."], "a": 0, "d": "Moderate", "e": "SRP comparisons can guide consumers on what or where to buy at the right price."}, {"q": "If a commodity is priced much higher than its suggested retail price, what is a practical consumer response based on the lesson?", "o": ["Compare prices and consider where to buy at a more reasonable price.", "Buy immediately without checking.", "Stop considering price.", "Assume the SRP is irrelevant."], "a": 0, "d": "Moderate", "e": "The lesson emphasizes comparing market prices with SRP to guide purchasing decisions."}, {"q": "Why can oil price increases have a broader effect on consumers?", "o": ["They can contribute to increases in commodity prices, affecting consumers’ purchasing decisions.", "They affect only oil companies.", "They automatically increase everyone’s income.", "They have no relationship with commodity prices."], "a": 0, "d": "Hard", "e": "Oil price increases can contribute to higher prices of basic commodities."}, {"q": "Which market structure has a single firm controlling the entire market?", "o": ["Perfect competition", "Monopoly", "Oligopoly", "Monopolistic competition"], "a": 1, "d": "Easy", "e": "A monopoly is a market structure in which one firm controls the entire market."}, {"q": "Which market structure is dominated by only a small number of firms?", "o": ["Monopoly", "Oligopoly", "Perfect competition", "Monopolistic competition"], "a": 1, "d": "Easy", "e": "Oligopoly is dominated by a small number of firms."}, {"q": "A market has many small firms selling similar but slightly differentiated products. What structure is this?", "o": ["Monopoly", "Oligopoly", "Monopolistic competition", "Perfect competition"], "a": 2, "d": "Moderate", "e": "Monopolistic competition has many small firms with similar but slightly differentiated products."}, {"q": "A market has many small firms competing with homogeneous products. Which structure best fits?", "o": ["Perfect competition", "Monopoly", "Oligopoly", "Monopolistic competition"], "a": 0, "d": "Moderate", "e": "Perfect competition is characterized by many small firms selling homogeneous products."}, {"q": "A barangay has only two stores selling a particular hardware product. Based on the examples and definitions in the LAS, which structure is the closest fit?", "o": ["Monopoly", "Oligopoly", "Perfect competition", "Monopolistic competition"], "a": 1, "d": "Hard", "e": "Only a small number of firms dominate the market, which matches oligopoly."}, {"q": "Which issue is directly associated with higher fuel costs and higher commodity prices in the LAS?", "o": ["Oil price increase", "Peace and order", "Education", "Tourism"], "a": 0, "d": "Easy", "e": "The LAS connects oil price increases with higher commodity prices."}, {"q": "What can fluctuations in the dollar exchange rate affect for OFW families?", "o": ["The amount of remittances received in pesos and their purchasing power", "The number of school subjects", "The weather", "The number of barangays"], "a": 0, "d": "Easy", "e": "Exchange-rate fluctuations can affect the peso value of OFW remittances and purchasing power."}, {"q": "How can poor peace and order affect businesses and industries?", "o": ["It can disrupt business and industrial operations.", "It always increases sales.", "It guarantees lower costs.", "It has no effect on operations."], "a": 0, "d": "Moderate", "e": "The LAS states that without peace and order, business and industrial operations can be disrupted."}, {"q": "Why can unemployment reduce people’s purchasing power?", "o": ["People with fewer employment opportunities may have less income to spend on goods and services.", "Unemployment automatically raises everyone’s income.", "It increases the supply of money for all families.", "It guarantees lower commodity prices."], "a": 0, "d": "Moderate", "e": "Limited employment opportunities can reduce income available for purchases."}, {"q": "An OFW family receives the same dollar amount as before, but the exchange rate changes so that the remittance converts into fewer pesos. What is the likely effect described in the LAS?", "o": ["The family’s purchasing power may decrease.", "The family’s purchasing power must increase.", "Commodity prices must become zero.", "The family is automatically unemployed."], "a": 0, "d": "Hard", "e": "Exchange-rate changes can affect remittances and purchasing power."}, {"q": "What is the purpose of business principles, tools, and techniques according to the LAS?", "o": ["To help organizations cope with changing markets and improve business performance", "To prevent all competition", "To eliminate management", "To stop businesses from changing"], "a": 0, "d": "Easy", "e": "They help organizations respond to changing markets, maintain competitiveness, and improve performance."}, {"q": "Which of the following is most appropriate when identifying a business opportunity?", "o": ["Considering market conditions and how the business can perform successfully", "Ignoring changes in the market", "Avoiding all planning", "Producing without considering customers"], "a": 0, "d": "Moderate", "e": "The LAS emphasizes systems and approaches that help organizations cope with changing markets and improve performance."}, {"q": "Why is leadership included in the business framework presented in the LAS?", "o": ["It interacts with management and organizational factors to support successful performance.", "It replaces all business processes.", "It removes the need for employees.", "It guarantees profit regardless of conditions."], "a": 0, "d": "Moderate", "e": "The framework illustrates management and leadership interacting with factors needed for business performance."}, {"q": "A small business regularly reviews its methods and adjusts them when market conditions change. Which principle from LAS 9 does this best demonstrate?", "o": ["Using systems and techniques to cope with changing markets", "Avoiding all controls", "Ignoring business performance", "Eliminating leadership"], "a": 0, "d": "Hard", "e": "Adapting systems and techniques to changing markets is a central purpose of business tools and principles."}, {"q": "Which business is listed in the LAS as a small business idea?", "o": ["Digital marketing services", "National government", "Public school", "Barangay election"], "a": 0, "d": "Easy", "e": "Digital marketing services is one of the ten small business ideas listed."}, {"q": "Which of the following is included among the listed business ideas?", "o": ["Street food", "Hospital administration", "Court services", "Public taxation"], "a": 0, "d": "Easy", "e": "Street food is one of the small business ideas in the LAS."}, {"q": "Which listed business is primarily associated with moving household belongings from one place to another?", "o": ["Moving company", "Junk shop", "CCTV installation", "Vending machine"], "a": 0, "d": "Moderate", "e": "The LAS lists a moving company (lipat-bahay) as a business opportunity."}, {"q": "A person has skills in computer networks and wants to offer professional services locally. Which business idea from the LAS best matches?", "o": ["IT & network consulting and training services", "Street food", "Junk shop", "Furniture rental"], "a": 0, "d": "Hard", "e": "IT and network consulting/training directly matches the described skills."}, {"q": "Which is identified as a main parameter of socioeconomic status in LAS 11?", "o": ["Income", "Weather", "Exchange rate only", "Oil supply only"], "a": 0, "d": "Easy", "e": "Income is one of the three main socioeconomic parameters identified."}, {"q": "How does limited income generally affect customers?", "o": ["They tend to restrict spending to essential items.", "They buy every expensive item.", "They stop considering needs.", "They automatically increase spending."], "a": 0, "d": "Easy", "e": "The LAS states that when income is scarce, customers tend to restrict spending to essentials."}, {"q": "Which socioeconomic factor refers to the type of jobs people perform based on skills, experiences, or choice?", "o": ["Occupation", "Income", "Education only", "Technology"], "a": 0, "d": "Moderate", "e": "Occupation refers to the type of work people perform based on skills, experience, or choice."}, {"q": "During an economic decline, a store owner decides to stock fewer expensive items. Which LAS concept supports this decision?", "o": ["Customers tend to avoid expensive items during economic decline.", "All customers buy the most expensive products.", "Income never affects spending.", "Social class has no effect on preferences."], "a": 0, "d": "Hard", "e": "LAS 11 advises businesses to consider prevailing economic conditions because customers may avoid expensive items during decline."}, {"q": "Which is an important question when assessing business viability?", "o": ["Who are your target customers?", "What is your favorite color?", "Who is the oldest employee?", "What is the weather every day?"], "a": 0, "d": "Easy", "e": "Target customers are one of the key viability questions listed in LAS 12."}, {"q": "Which is a positive community impact of a successful local business mentioned in the LAS?", "o": ["Creating more jobs", "Eliminating all competition", "Reducing product choices", "Avoiding taxes"], "a": 0, "d": "Moderate", "e": "Local businesses can create jobs and increase the community tax base."}, {"q": "A proposed business has a product idea but no reliable source of raw materials and no clear target market. What should the owner do first based on the LAS?", "o": ["Assess supply sources and potential market demand before proceeding.", "Open immediately without research.", "Ignore competitors.", "Set a price without knowing customers."], "a": 0, "d": "Hard", "e": "LAS 12 emphasizes checking raw-material supply and potential market size/demand when assessing viability."}, {"q": "What is the purpose of organizational control in a business?", "o": ["To establish rules, guidelines, procedures, limits, and protocols for directing work and processes.", "To eliminate all business rules.", "To prevent management from making decisions.", "To guarantee that competitors disappear."], "a": 0, "d": "Hard", "e": "Organizational control involves rules, guidelines, procedures, limits, and protocols for directing business work."}, {"q": "What should a business maintain or improve to encourage customer patronage?", "o": ["Product quality and offered services", "Only its building size", "Only its employee uniforms", "Only its advertising budget"], "a": 0, "d": "Easy", "e": "The LAS emphasizes maintaining or improving product quality and services."}, {"q": "Maintaining the quality of a specialty food in a restaurant most directly means maintaining its ________.", "o": ["Taste", "Table", "Waiter", "Price tag"], "a": 0, "d": "Moderate", "e": "The LAS gives taste as an example of maintaining product quality."}, {"q": "How can a negative business issue sometimes become an opportunity?", "o": ["It can be managed in a way that builds positive promotion for the product or service.", "It must always destroy the business.", "It should always be ignored.", "It automatically guarantees higher costs."], "a": 0, "d": "Moderate", "e": "The LAS notes that a negative issue can sometimes become an opportunity for positive promotion."}, {"q": "Which strategy best reflects the overall goal of LAS 13?", "o": ["Maintain quality, improve services, manage problems responsibly, and protect the business’s reputation.", "Ignore customer concerns to reduce costs.", "Change products without considering consequences.", "Focus only on profit and disregard relationships."], "a": 0, "d": "Hard", "e": "LAS 13 emphasizes quality, service improvement, healthy relationships, and managing harmful issues to protect the business."}];
let order=[],pos=0,score=0,streak=0,answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle([...Array(DATA.length).keys()]);pos=0;score=0;streak=0;$('start').classList.add('hidden');$('finish').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){
 answered=false; const x=DATA[order[pos]];
 $('count').textContent=`Question ${pos+1} of ${DATA.length}`;
 $('score').textContent=score; $('streak').textContent=streak;
 $('fill').style.width=(pos/DATA.length*100)+'%'; $('difficulty').textContent=x.d;
 $('question').textContent=x.q; $('feedback').innerHTML='';
 $('next').disabled=true; $('next').textContent=pos===DATA.length-1?'See Results 🏆':'Next Question →';
 const box=$('options');box.innerHTML='';
 x.o.forEach((text,i)=>{
   const b=document.createElement('button');b.className='option';
   b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${text}`;
   b.onclick=()=>answer(i,b);box.appendChild(b);
 });
}
function answer(choice,clicked){
 if(answered)return;answered=true;const x=DATA[order[pos]];
 [...$('options').children].forEach(b=>b.disabled=true);
 if(choice===x.a){
   clicked.classList.add('correct');streak++;
   const pts=x.d==='Hard'?3:x.d==='Moderate'?2:1;score+=pts;
   $('feedback').innerHTML=`<b>✅ Correct! +${pts} point${pts>1?'s':''}</b><br>${x.e}`;
 }else{
   clicked.classList.add('wrong');$('options').children[x.a].classList.add('correct');streak=0;
   $('feedback').innerHTML=`<b>❌ Not quite.</b><br>Correct answer: <b>${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</b><br>${x.e}`;
 }
 $('score').textContent=score;$('streak').textContent=streak;$('next').disabled=false;
}
$('begin').onclick=start;
$('next').onclick=()=>{if(!answered)return;if(pos<DATA.length-1){pos++;render()}else{
 $('game').classList.add('hidden');$('finish').classList.remove('hidden');
 $('fill').style.width='100%';$('final').textContent=`You earned ${score} points!`;
 const max=DATA.length*3,p=score/max;
 $('message').textContent=p>=.9?'Outstanding! You are exam-ready! 🏆':p>=.75?'Great job! Review the questions you missed. 💪':p>=.6?'Good start! A little more review will help. 📚':'Keep practicing—you can do this! 🔥';
}};
$('again').onclick=start;
</script>
</body>
</html>
